{{- if include "skylight-wifi-automation.createsSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skylight-wifi-automation.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skylight-wifi-automation.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if .Values.secrets.encryptionKey }}
  {{ .Values.secrets.keys.encryption }}: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKeyNew }}
  {{ .Values.secrets.keys.encryptionNew }}: {{ .Values.secrets.encryptionKeyNew | quote }}
  {{- end }}
  {{- if .Values.secrets.setupToken }}
  {{ .Values.secrets.keys.setupToken }}: {{ .Values.secrets.setupToken | quote }}
  {{- end }}
  {{- if .Values.secrets.skylightEmail }}
  {{ .Values.secrets.keys.skylightEmail }}: {{ .Values.secrets.skylightEmail | quote }}
  {{- end }}
  {{- if .Values.secrets.skylightPassword }}
  {{ .Values.secrets.keys.skylightPassword }}: {{ .Values.secrets.skylightPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.unifiApiKey }}
  {{ .Values.secrets.keys.unifiApiKey }}: {{ .Values.secrets.unifiApiKey | quote }}
  {{- end }}
{{- end }}
