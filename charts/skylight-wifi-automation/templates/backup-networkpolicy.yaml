{{- if .Values.backup.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-backup-deny" (include "skylight-wifi-automation.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skylight-wifi-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "skylight-wifi-automation.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backup
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
{{- end }}
