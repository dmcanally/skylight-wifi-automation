name: Chart

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install chart-testing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq yamllint python3-venv
          python3 -m venv /tmp/ct-venv
          /tmp/ct-venv/bin/pip install -q 'yamale==6.0.0'
          sudo ln -sf /tmp/ct-venv/bin/yamale /usr/local/bin/yamale
          curl -fsSL -o /tmp/ct.tgz https://github.com/helm/chart-testing/releases/download/v3.11.0/chart-testing_3.11.0_linux_amd64.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/ct.tgz ct
          curl -fsSL -o /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/kubeconform.tgz kubeconform
      - name: Chart-testing lint
        run: ct lint --config ct.yaml
      - name: kubeconform
        run: |
          set -euo pipefail
          chart=charts/skylight-wifi-automation
          schema='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          render() {
            local name="$1"
            shift
            helm template test "$chart" --namespace skylight-wifi "$@" > "/tmp/${name}.yaml"
            kubeconform -strict -summary -kubernetes-version 1.31.0 \
              -schema-location default \
              -schema-location "$schema" \
              "/tmp/${name}.yaml"
          }
          render default
          render minimal -f "$chart/examples/minimal.yaml"
          render nodeport -f "$chart/examples/nodeport-with-backup.yaml"
          render ingress -f "$chart/examples/ingress.yaml"
          render all -f "$chart/ci/all-features-values.yaml"

  install:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: skylight-wifi
          node_image: kindest/node:v1.31.2
      - name: Install and helm test
        run: |
          set -euo pipefail
          kubectl create namespace skylight-wifi
          kubectl -n skylight-wifi create secret generic skylight-wifi-automation \
            --from-literal=APP_ENCRYPTION_KEY="$(openssl rand -base64 32 | tr -d '\n')" \
            --from-literal=ADMIN_SETUP_TOKEN="$(openssl rand -base64 32 | tr -d '\n')"
          # The example certificate lets the process start. It is not a gateway certificate.
          # Backup is enabled so one CronJob run can be checked after helm test.
          # Do not use helm --wait here. The backups claim stays Pending
          # until the first backup pod on a WaitForFirstConsumer StorageClass.
          helm upgrade --install skylight-wifi-automation charts/skylight-wifi-automation \
            --namespace skylight-wifi \
            --set secrets.existingSecret=skylight-wifi-automation \
            --set backup.enabled=true \
            --set backup.timeZone=Etc/UTC \
            --set-file config.unifi_tls_ca=charts/skylight-wifi-automation/files/unifi.local.example.crt
          kubectl -n skylight-wifi rollout status deploy/skylight-wifi-automation --timeout=6m
          helm test skylight-wifi-automation --namespace skylight-wifi --timeout 3m
          kubectl -n skylight-wifi create job --from=cronjob/skylight-wifi-automation-backup skylight-wifi-backup-now
          kubectl -n skylight-wifi wait --for=condition=complete job/skylight-wifi-backup-now --timeout=180s
          kubectl -n skylight-wifi logs job/skylight-wifi-backup-now | tee /tmp/backup.log
          grep -E 'backup ok file=.+ bytes=[0-9]+ kept=[0-9]+' /tmp/backup.log
