[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skylight-wifi-automation"
version = "0.2.1"
description = "Pause UniFi Object Manager blocks when Skylight tasks are complete"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "jinja2>=3.1,<4",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.8,<3",
  "pyskylight>=0.1.0",
  "python-multipart>=0.0.18,<1",
  "PyYAML>=6.0,<7",
  "starlette>=0.41,<1",
  "tzdata>=2024.1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
skylight-wifi = "skylight_wifi_automation.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skylight_wifi_automation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
