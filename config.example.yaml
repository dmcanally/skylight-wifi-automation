timezone: America/Chicago
poll_seconds: 60
# Zero object writes. The process logs unlock= and lock= and does not pause
# or resume anything.
dry_run: true
include_late: true
include_routines: true
# A day with no chores stays blocked. Set true only if an empty day should unlock.
empty_day_unlocks: false
unifi_url: "https://unifi.local/proxy/network/integration/v1"
# Optional site UUID, internalReference, or name. Omit on a one-site gateway.
# unifi_site:
# Placeholder only. Paste the gateway console certificate. Not a secret.
# Re-pin before it expires or after a firmware reset that regenerates it.
unifi_tls_ca: |
  -----BEGIN CERTIFICATE-----
  <paste your console certificate>
  -----END CERTIFICATE-----
children:
  - name: child-a
    skylight_profile: Child A
    object_name: "No Internet - child-a"
    cutoff: "20:30"
    manual_unblock: false
  - name: child-b
    skylight_profile: Child B
    object_name: "No Internet - child-b"
    cutoff: "20:30"
    manual_unblock: false
  - name: child-c
    skylight_profile: Child C
    object_name: "No Internet - child-c"
    cutoff: "20:00"
    manual_unblock: false
