apiVersion: apps/v1
kind: Deployment
metadata:
  name: wifi-automation
  namespace: wifi-automation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wifi-automation
  template:
    metadata:
      labels:
        app: wifi-automation
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: "192.168.1.1"
          hostnames:
            - unifi.local
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wifi-automation
          image: ghcr.io/dmcanally/skylight-wifi-automation:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: /config/config.yaml
            - name: SKYLIGHT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: wifi-automation-secrets
                  key: SKYLIGHT_EMAIL
            - name: SKYLIGHT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wifi-automation-secrets
                  key: SKYLIGHT_PASSWORD
            - name: UNIFI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wifi-automation-secrets
                  key: UNIFI_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: wifi-automation-config
        - name: tmp
          emptyDir: {}
